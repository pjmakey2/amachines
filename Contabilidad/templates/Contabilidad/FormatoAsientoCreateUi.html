<div class="ui_formatoasiento">
    <form id="form_formatoasiento_{{ rr }}" class="form_formatoasiento">
        <input type="hidden" name="id" value="{{ mobj.pk }}">
        <div class="alert alert-secondary py-2">Evento: <b>{{ mobj.evento }}</b>. Cada línea toma un <b>monto</b> calculado por el evento y lo lleva a la
            cuenta del <b>rol</b> (o a una cuenta fija). Las líneas con monto 0 no se asientan.</div>
        <div class="row">
            <div class="col-md-5 mb-3"><label>Nombre</label><input type="text" name="nombre" class="form-control" value="{{ mobj.nombre }}" required /></div>
            <div class="col-md-5 mb-3"><label>Concepto del asiento</label><input type="text" name="concepto" class="form-control" value="{{ mobj.concepto }}" required />
                <small class="text-muted">Admite variables del evento: {numero}, {cliente}, {beneficiario}, {concepto}...</small></div>
            <div class="col-md-2 mb-3"><label>Activo</label>
                <select name="activo" class="form-control"><option value="true" {% if mobj.activo %}selected{% endif %}>Sí</option><option value="false" {% if not mobj.activo %}selected{% endif %}>No</option></select></div>
        </div>
        <table class="table table-sm">
            <thead><tr><th>Lado</th><th>Monto (clave)</th><th>Rol</th><th style="width: 30%;">Cuenta fija (opcional)</th><th>Glosa</th><th></th></tr></thead>
            <tbody name="tbody_lineas"></tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary mb-3" name="btn_add_linea"><i class="mdi mdi-plus"></i> Agregar línea</button>
        <div><button class="btn btn-primary" type="submit">Guardar formato</button></div>
    </form>
</div>
<script type="text/javascript">
    qelem('#offcanvasGlobalUiLabel').innerHTML = `Formato de asiento: {{ mobj.nombre }}`;
    formato_sel = (name) => `#form_formatoasiento_{{ rr }} [name=${name}]`;
    formato_roles = [];
    formato_cuentas = [];
    formato_add_linea = (l) => {
        l = l || {};
        let tr = document.createElement('tr');
        tr.innerHTML = `<td><select name="ln_lado" class="form-control form-control-sm"><option value="debe">Debe</option><option value="haber">Haber</option></select></td>
            <td><input type="text" name="ln_monto" class="form-control form-control-sm"></td>
            <td><select name="ln_rol" class="form-control form-control-sm"></select></td>
            <td><select name="ln_cuenta" class="form-control form-control-sm"></select></td>
            <td><input type="text" name="ln_glosa" class="form-control form-control-sm"></td>
            <td><i title="Quitar" class="mdi mdi-close text-danger cursor-pointer" name="ln_quitar"></i></td>`;
        let rol = tr.querySelector('[name=ln_rol]'), cuenta = tr.querySelector('[name=ln_cuenta]');
        rol.add(new Option('(sin rol)', ''));
        formato_roles.forEach((r) => rol.add(new Option(r, r)));
        cuenta.add(new Option('(según el rol)', ''));
        formato_cuentas.forEach((c) => cuenta.add(new Option(c.text, c.id)));
        tr.querySelector('[name=ln_lado]').value = l.lado || 'debe';
        tr.querySelector('[name=ln_monto]').value = l.monto || '';
        rol.value = l.rol || '';
        cuenta.value = l.cuenta_id || '';
        tr.querySelector('[name=ln_glosa]').value = l.glosa || '';
        tr.querySelector('[name=ln_quitar]').addEventListener('click', () => tr.remove());
        qelem(formato_sel('tbody_lineas')).appendChild(tr);
    }
    qelem(formato_sel('btn_add_linea')).addEventListener('click', () => formato_add_linea());

    formato_post = (mname, extra) => {
        let gbe = new FormData();
        gbe.append('module', 'Contabilidad');
        gbe.append('package', 'mng_contabilidad');
        gbe.append('attr', 'MContabilidad');
        gbe.append('mname', mname);
        gbe.append('dbcon', 'default');
        Object.keys(extra || {}).forEach((key) => gbe.append(key, extra[key]));
        return axios.post('{% url "iom" %}', gbe, { headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')} });
    }
    formato_post('get_config').then((rsp) => {
        formato_cuentas = rsp.data.cuentas || [];
        formato_post('get_formato', {id: '{{ mobj.pk }}'}).then((r2) => {
            formato_roles = r2.data.roles || [];
            (r2.data.lineas || []).forEach((l) => formato_add_linea(l));
        });
    });

    qelem('#form_formatoasiento_{{ rr }}').addEventListener('submit', (evt) => {
        evt.preventDefault();
        let fdata = new FormData();
        fdata.append('module', 'OptsIO');
        fdata.append('package', 'io_maction');
        fdata.append('attr', 'IOMaction');
        fdata.append('mname', 'process_record');
        fdata.append('model_app_name', 'Contabilidad');
        fdata.append('model_name', 'FormatoAsiento');
        fdata.append('dbcon', 'default');
        let edata = { id: qelem(formato_sel('id')).value, nombre: qelem(formato_sel('nombre')).value,
                      concepto: qelem(formato_sel('concepto')).value, activo: qelem(formato_sel('activo')).value, lineas: [] };
        document.querySelectorAll('#form_formatoasiento_{{ rr }} tbody[name=tbody_lineas] tr').forEach((tr) => {
            edata.lineas.push({ lado: tr.querySelector('[name=ln_lado]').value, monto: tr.querySelector('[name=ln_monto]').value,
                                rol: tr.querySelector('[name=ln_rol]').value, cuenta_id: tr.querySelector('[name=ln_cuenta]').value,
                                glosa: tr.querySelector('[name=ln_glosa]').value });
        });
        fdata.append('uc_fields', jfy(edata));
        fdata.append('b_vals', jfy([]));
        fdata.append('c_a', jfy([{ 'module': 'Contabilidad', 'package': 'mng_contabilidad', 'attr': 'MContabilidad', 'mname': 'save_formato', 'cont': false, 'show_success': true }]));
        fdata.append('a_vals', jfy([]));
        axios.post('{% url "iom" %}', fdata, { headers: { 'X-CSRFToken': OptsIO.getCookie('csrftoken') } }).then((rsp) => {
            let msgs = rsp.data.hasOwnProperty('msgs') ? rsp.data.msgs : [rsp.data];
            let got_error = msgs.some((ee) => ee.error);
            UiB.BeMsgHandle({ rsps: msgs, timer: 2000, offcanvasglobal: true });
            if (!got_error) $('#{{ t_guid }}').DataTable().ajax.reload();
        }).catch((err) => { UiB.MsgError(err); });
    })
</script>
