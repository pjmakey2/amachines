<div class="ui_plancuenta">
    <form id="form_plancuenta_{{ rr }}" class="form_plancuenta">
        <input type="hidden" name="id" {% if mobj %} value="{{ mobj.pk }}" {% endif %}>
        <div class="row">
            <div class="col-md-5 mb-3" data-field="codigo">
                <label>Código <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="codigo" class="form-control" placeholder="3.1.3.2" value='{% if mobj %}{{ mobj.codigo }}{% else %}{% endif %}' required {% if mobj %}readonly{% endif %} />
                </div>
                <small class="text-muted">Cargue solo los niveles con valor (3.1.3.2). Se completa al formato del negocio y hereda el tipo del padre.</small>
            </div>
            <div class="col-md-7 mb-3" data-field="nombre">
                <label>Nombre <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="nombre" class="form-control" placeholder="" value='{% if mobj %}{{ mobj.nombre }}{% else %}{% endif %}' required />
                </div>
            </div>
            <div class="col-md-6 mb-3" data-field="tipo">
                <label>Tipo (solo cuentas de primer nivel)</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="tipo" class="form-control">
                        <option value="activo" {% if mobj and mobj.tipo == "activo" %}selected{% endif %}>Activo</option>
                        <option value="pasivo" {% if mobj and mobj.tipo == "pasivo" %}selected{% endif %}>Pasivo</option>
                        <option value="patrimonio" {% if mobj and mobj.tipo == "patrimonio" %}selected{% endif %}>Patrimonio Neto</option>
                        <option value="ingreso" {% if mobj and mobj.tipo == "ingreso" %}selected{% endif %}>Ingreso</option>
                        <option value="costo" {% if mobj and mobj.tipo == "costo" %}selected{% endif %}>Costo</option>
                        <option value="gasto" {% if mobj and mobj.tipo == "gasto" %}selected{% endif %}>Gasto</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-3" data-field="activo">
                <label>Activa</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="activo" class="form-control">
                        <option value="true" {% if not mobj or mobj.activo %}selected{% endif %}>Sí</option>
                        <option value="false" {% if mobj and not mobj.activo %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="alert alert-secondary py-2" name="codigo_preview">
            {% if mobj %}<b>{{ mobj.codigo }}</b> · nivel {{ mobj.nivel }}<br><span class="small">{{ mobj.get_ruta }}</span>{% else %}Escriba el código para ver cómo queda.{% endif %}
        </div>

        <div class="row mt-2">
            <div class="col-md-12 text-start">
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript">
    {% if not en_modal %}qelem('#offcanvasGlobalUiLabel').innerHTML = `{% if mobj %}Modificar Cuenta {{ mobj.pk }}{% else %}Crear Cuenta{% endif %}`;{% endif %}

    save_plancuenta = (target) => {
        let fdata = new FormData();
        fdata.append('module', 'OptsIO');
        fdata.append('package', 'io_maction');
        fdata.append('attr', 'IOMaction');
        fdata.append('mname', 'process_record');
        fdata.append('model_app_name', 'Contabilidad');
        fdata.append('model_name', 'PlanCuenta');
        fdata.append('dbcon', 'default');
        let edata = form_serials.form_to_json(new FormData(target));
        [].forEach((idx) => {
            let vv = $(`#form_plancuenta_{{ rr }} select[name=${idx}]`).val();
            if (vv !== undefined) edata[idx] = vv;
        });
        // Leer valores sin mascara directamente del inputmask (el backend recibe punto decimal)
        [].forEach((f) => {
            let el = qelem(`#form_plancuenta_{{ rr }} input[name=${f}]`);
            if (el && el.inputmask) edata[f] = el.inputmask.unmaskedvalue().replace(',', '.');
        });
        [].forEach((f) => {
            let el = qelem(`#form_plancuenta_{{ rr }} input[name=${f}]`);
            delete edata[f];
            if (el && el.files.length > 0) fdata.append(f, el.files[0]);
        });
        
        fdata.append('uc_fields', jfy(edata));
        fdata.append('b_vals', jfy([]));
        fdata.append('c_a', jfy([{ 'module': 'Contabilidad', 'package': 'mng_contabilidad', 'attr': 'MContabilidad', 'mname': 'create_cuenta', 'cont': false, 'show_success': true }]));
        fdata.append('a_vals', jfy([]));
        let fele = document.querySelector('#form_plancuenta_{{ rr }}');
        fele.classList.add('overlay-container');
        fele.classList.add('overlay');
        return axios.post('{% url "iom" %}', fdata, { headers: { 'X-CSRFToken': OptsIO.getCookie('csrftoken') } })
        .then((rsp) => {
            let msgs = rsp.data.hasOwnProperty('msgs') ? rsp.data.msgs : [rsp.data];
            let got_error = msgs.some((ee) => ee.error);
            UiB.BeMsgHandle({ rsps: msgs, timer: 2000, offcanvasglobal: {% if en_modal %}false{% else %}true{% endif %} });
            if (!got_error) {
                $('#{{ t_guid }}').DataTable().ajax.reload();
                
            }
        }).catch((err) => {
            log.error(`#form_plancuenta Error in save record: ` + JSON.stringify(err, null, 2));
            UiB.MsgError(err);
        }).finally(() => {
            let ft = document.querySelector('#form_plancuenta_{{ rr }}');
            if (ft) {
                ft.classList.remove('overlay-container');
                ft.classList.remove('overlay');
            }
        });
    }

    qelem('#form_plancuenta_{{ rr }}').addEventListener('submit', (evt) => {
        evt.preventDefault();
        save_plancuenta(evt.target);
    })

    {% if not mobj %}
    plancuenta_preview_timer = null;
    plancuenta_preview = () => {
        let gbe = new FormData();
        gbe.append('module', 'Contabilidad');
        gbe.append('package', 'mng_contabilidad');
        gbe.append('attr', 'MContabilidad');
        gbe.append('mname', 'preview_codigo');
        gbe.append('dbcon', 'default');
        gbe.append('codigo', qelem('#form_plancuenta_{{ rr }} input[name=codigo]').value);
        axios.post('{% url "iom" %}', gbe, { headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')} }).then((rsp) => {
            let box = qelem('#form_plancuenta_{{ rr }} [name=codigo_preview]');
            let d = rsp.data, esc = (v) => $('<span>').text(v == null ? '' : v).html();
            let tipoSel = qelem('#form_plancuenta_{{ rr }} select[name=tipo]');
            if (d.error) { box.className = 'alert alert-danger py-2'; box.innerHTML = esc(d.error) + ` <span class="small">(formato ${esc(d.formato)})</span>`; return; }
            if (!d.codigo) { box.className = 'alert alert-secondary py-2'; box.textContent = 'Escriba el código para ver cómo queda.'; return; }
            let padre = d.padre === null ? '<span class="text-danger">La cuenta padre no existe: créela primero.</span>' :
                        (d.padre ? `Cuelga de: <b>${esc(d.padre)}</b>` : 'Cuenta de primer nivel: elija el tipo.');
            box.className = 'alert py-2 ' + (d.existente ? 'alert-warning' : (d.padre === null ? 'alert-danger' : 'alert-info'));
            box.innerHTML = `<b class="font-monospace">${d.codigo}</b> · nivel ${d.nivel}<br><span class="small">${padre}${d.existente ? ' · <b>Ya existe:</b> ' + esc(d.existente) : ''}</span>`;
            tipoSel.disabled = !!d.padre;
            if (d.tipo) tipoSel.value = d.tipo;
        });
    }
    qelem('#form_plancuenta_{{ rr }} input[name=codigo]').addEventListener('input', () => {
        clearTimeout(plancuenta_preview_timer);
        plancuenta_preview_timer = setTimeout(plancuenta_preview, 300);
    });
    {% else %}
    qelem('#form_plancuenta_{{ rr }} select[name=tipo]').disabled = true;
    {% endif %}
</script>
