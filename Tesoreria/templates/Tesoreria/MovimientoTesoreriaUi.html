<div class="movimiento_ui_container container-fluid">
    <div class="toolbar mb-3 d-flex justify-content-between align-items-center">
        <div class="toolbar-buttons">
            <button id="btn_crear_movimiento" class="btn btn-primary me-2"><i class="mdi mdi-plus"></i> Movimiento manual</button>
            <button id="btn_borrar_movimiento" class="btn btn-danger"><i class="mdi mdi-delete"></i> Anular</button>
        </div>
        <div class="toolbar-search">
            <input type="text" id="input_buscar_movimiento" class="form-control" placeholder="Buscar...">
        </div>
    </div>
    <div id="table_movimiento_ui"></div>
</div>
<script type="text/javascript">
    var gmquery_movimiento = [];
    movimiento_home_be = function (data, settings) {
        let tt = qelem(`#table_movimiento_ui`);
        tt.classList.add('overlay-container');
        tt.classList.add('overlay');
        let crdata = Object.assign({}, settings.ajax.initquery);
        let mquery = [];
        if (gmquery_movimiento.length > 0) mquery = [...mquery, ...gmquery_movimiento];
        if (mquery.length > 0) crdata.mquery = jfy(mquery);
        return Object.assign(data, crdata);
    }
    t_movimiento = `dtable_${OptsIO.s4generate()}`;
    Grid.datatables_wrapper({
          t_guid: t_movimiento,
          url_exec: '{% url "iom" %}',
          title: 'Movimientos de Tesorería',
          tselector: 'table_movimiento_ui',
          app_name: 'Tesoreria',
          model_name: 'MovimientoTesoreria',
          cls_table: 'cell-border row-border table table-sm',
          cls_thead: 'border-gray-900',
          mquery: [],
          plength: 100,
          builder_be: movimiento_home_be,
          t_opts: {
              select: true,
              fixedHeader: true,
              responsive: null,
              scrollCollapse: true,
              scrollX: true,
              scrollY: 600,
              paging: true,
              order: [[1, 'desc']],
              rowId: function(row, se) { return `tr_movimiento_${row.id}` }
          },
          columns: [
               { fdis: true, gre: false, btyp: 'loc', idx: null, tit: 'ACC', dtyp: 'str', dfl: '', nord: false,
                dfcon: `` },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'fecha', tit: 'Fecha', cls: 'align-left', dtyp: 'date', hide: false },
              { fdis: true, gre: true, btyp: 'mdb', idx: 'get_destino', tit: 'Cuenta / Caja', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'tipo', tit: 'Tipo', cls: 'align-left', dtyp: 'str', hide: false,
                 render: (data, type, rowobj) => { return data === 'ingreso' ? '<span class="badge bg-success">Ingreso</span>' : '<span class="badge bg-danger">Egreso</span>'; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'monto', tit: 'Monto', cls: 'align-right', dtyp: 'float', hide: false,
                 render: (data, type, rowobj) => { return UiN.formatNumberU(parseFloat(data || 0).toFixed(0)); } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'moneda', tit: 'Moneda', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'concepto', tit: 'Concepto', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'referencia', tit: 'Referencia', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'origen_model', tit: 'Origen', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'anulado', tit: 'Anulado', cls: 'align-center', dtyp: 'bool', hide: false,
                 render: (data, type, rowobj) => { return data ? 'Sí' : 'No'; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'cargado_usuario', tit: 'Usuario', cls: 'align-left', dtyp: 'str', hide: false },
          ]
      })

    movimiento_form_crud = (pk) => {
        let dattrs = { title: 'Movimientos de Tesorería', t_guid: t_movimiento, sui_rr: '{{ rr }}', offcanvasglobal: true };
        let tps = {
            model_app_name: 'Tesoreria',
            model_name: 'MovimientoTesoreria',
            dbcon: 'default',
            url: '{% url "dtmpl" %}',
            dattrs: dattrs,
            template: 'Tesoreria/MovimientoTesoreriaCreateUi.html',
            raw: true,
        }
        if (pk) tps['pk'] = pk;
        OptsIO.getTmpl(tps).then((rsp) => {
            $('#offcanvasGlobalUiBody').html(rsp.data);
            new bootstrap.Offcanvas('#offcanvasGlobalUi').show();
            document.getElementById('offcanvasGlobalUi').addEventListener('hidden.bs.offcanvas', () => {
                $('#offcanvasGlobalUiBody').html('');
            }, { once: true })
            UiB.kILLLoaderAjax();
        })
    }


    qelem('#btn_crear_movimiento').addEventListener('click', () => movimiento_form_crud());

    qelem('#btn_borrar_movimiento').addEventListener('click', function() {
        let ids = $(`#${t_movimiento}`).DataTable().rows({ selected: true }).data().toArray().map(row => row.id);
        if (ids.length === 0) {
            UiB.MsgError('Por favor, selecciona al menos un registro.');
            return;
        }
        UiB.MsgSwall({
            msg: `¿Anular ${ids.length} movimiento(s)?`,
            ttype: 'info'
        }).then((result) => {
            if (!result.isConfirmed) return;
            let gbe = new FormData();
            gbe.append('module', 'Tesoreria');
            gbe.append('package', 'mng_tesoreria');
            gbe.append('attr', 'MTesoreria');
            gbe.append('mname', 'anular_movimientos');
            gbe.append('dbcon', 'default');
            gbe.append('ids', jfy(ids));
            axios.post('{% url "iom" %}', gbe, { headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')} }).then((rsp) => {
                UiB.BeMsgHandle({ rsps: rsp.data.msgs, timer: 2000, offcanvasglobal: true });
                $(`#${t_movimiento}`).DataTable().ajax.reload();
            }).catch((err) => {
                log.error(`Error: ${jfy(err)}`);
                UiB.MsgError('Ocurrió un error. Por favor, intenta de nuevo.');
            });
        });
    });

    qelem('#input_buscar_movimiento').onkeydown = (evt) => {
        if (evt.key === 'Enter') {
            gmquery_movimiento = [];
            let v = qelem('#input_buscar_movimiento').value.trim();
            if (v !== '') {
                gmquery_movimiento.push({'field': 'or_concepto__icontains', 'value': v});
                gmquery_movimiento.push({'field': 'or_referencia__icontains', 'value': v});
            }
            $(`#${t_movimiento}`).DataTable().ajax.reload();
        }
    }

    $(`#${t_movimiento}`).on('draw.dt', function() {
        let tt = qelem(`#table_movimiento_ui`);
        tt.classList.remove('overlay-container');
        tt.classList.remove('overlay');
    })
</script>
