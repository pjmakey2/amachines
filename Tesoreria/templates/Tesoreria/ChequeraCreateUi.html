<div class="ui_chequera">
    <form id="form_chequera_{{ rr }}" class="form_chequera">
        <input type="hidden" name="id" {% if mobj %} value="{{ mobj.pk }}" {% endif %}>
        <div class="row">
            <div class="col-md-12 mb-3">
                <label>Cuenta bancaria <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="cuentaobj_id" class="form-control" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <label>Tipo</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="tipo" class="form-control">
                        <option value="vista" {% if mobj and mobj.tipo == "vista" %}selected{% endif %}>A la vista</option>
                        <option value="diferido" {% if mobj and mobj.tipo == "diferido" %}selected{% endif %}>Pago diferido</option>
                    </select>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <label>Serie</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="serie" class="form-control" placeholder="" value='{% if mobj %}{{ mobj.serie }}{% else %}{% endif %}' />
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <label>Activa</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="activo" class="form-control">
                        <option value="true" {% if not mobj or mobj.activo %}selected{% endif %}>Sí</option>
                        <option value="false" {% if mobj and not mobj.activo %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label>Número desde <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="numero_desde" class="form-control text-end" placeholder="" value='{% if mobj %}{{ mobj.numero_desde|stringformat:"s" }}{% else %}{% endif %}' required />
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label>Número hasta <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="numero_hasta" class="form-control text-end" placeholder="" value='{% if mobj %}{{ mobj.numero_hasta|stringformat:"s" }}{% else %}{% endif %}' required />
                </div>
                <small class="text-muted">El próximo número a emitir arranca en "desde" y avanza solo.</small>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12 text-start">
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript">
    qelem('#offcanvasGlobalUiLabel').innerHTML = `{% if mobj %}Modificar Chequera {{ mobj.pk }}{% else %}Crear Chequera{% endif %}`;

    form_search.se_populate({
        surl: '{% url "iom" %}',
        dele: '#form_chequera_{{ rr }} select[name=cuentaobj_id]',
        app_name: 'Tesoreria',
        model_name: 'CuentaBancaria',
        field_display: ["get_descripcion"],
        field_id: ['id'],
        db_fields: ["id"],
        db_methods: ["get_descripcion"],
        qs_be: [{"field": "activo", "value": true}],
        dbcon: 'default',
        headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')},
        first_selected: false,
        allowClear: false,
        width: '100%',
        dropdownParent: $('#offcanvasGlobalUi'),
        theme: 'bootstrap-5'
    }).then(() => {
        {% if mobj and mobj.cuentaobj %}
            $('#form_chequera_{{ rr }} select[name=cuentaobj_id]').val('{{ mobj.cuentaobj.id }}').trigger('change');
        {% endif %}
    });

    initializeInputMasks_chequera = () => {
        let maskDecimal = {
            alias: 'numeric', groupSeparator: ',', radixPoint: '.', autoGroup: true, digits: 2,
            digitsOptional: false, rightAlign: true, allowMinus: false,
            removeMaskOnSubmit: true, autoUnmask: true
        };
        let maskEntero = Object.assign({}, maskDecimal, { digits: 0, groupSeparator: '', autoGroup: false });
        Inputmask(maskEntero).mask(qelem('#form_chequera_{{ rr }} input[name=numero_desde]'));
        Inputmask(maskEntero).mask(qelem('#form_chequera_{{ rr }} input[name=numero_hasta]'));
    }
    initializeInputMasks_chequera();

    save_chequera = (target) => {
        let fdata = new FormData();
        fdata.append('module', 'OptsIO');
        fdata.append('package', 'io_maction');
        fdata.append('attr', 'IOMaction');
        fdata.append('mname', 'process_record');
        fdata.append('model_app_name', 'Tesoreria');
        fdata.append('model_name', 'Chequera');
        fdata.append('dbcon', 'default');
        let edata = form_serials.form_to_json(new FormData(target));
        ["cuentaobj_id"].forEach((idx) => {
            let vv = $(`#form_chequera_{{ rr }} select[name=${idx}]`).val();
            if (vv !== undefined) edata[idx] = vv;
        });
        // Leer valores sin mascara directamente del inputmask (el backend recibe punto decimal)
        ["numero_desde", "numero_hasta"].forEach((f) => {
            let el = qelem(`#form_chequera_{{ rr }} input[name=${f}]`);
            if (el && el.inputmask) edata[f] = el.inputmask.unmaskedvalue().replace(',', '.');
        });
        fdata.append('uc_fields', jfy(edata));
        fdata.append('b_vals', jfy([]));
        fdata.append('c_a', jfy([{ 'module': 'Tesoreria', 'package': 'mng_tesoreria', 'attr': 'MTesoreria', 'mname': 'create_chequera', 'cont': false, 'show_success': true }]));
        fdata.append('a_vals', jfy([]));
        let fele = document.querySelector('#form_chequera_{{ rr }}');
        fele.classList.add('overlay-container');
        fele.classList.add('overlay');
        return axios.post('{% url "iom" %}', fdata, { headers: { 'X-CSRFToken': OptsIO.getCookie('csrftoken') } })
        .then((rsp) => {
            let msgs = rsp.data.hasOwnProperty('msgs') ? rsp.data.msgs : [rsp.data];
            let got_error = msgs.some((ee) => ee.error);
            UiB.BeMsgHandle({ rsps: msgs, timer: 2000, offcanvasglobal: true });
            if (!got_error) {
                $('#{{ t_guid }}').DataTable().ajax.reload();
                
            }
        }).catch((err) => {
            log.error(`#form_chequera Error in save record: ` + JSON.stringify(err, null, 2));
            UiB.MsgError(err);
        }).finally(() => {
            let ft = document.querySelector('#form_chequera_{{ rr }}');
            if (ft) {
                ft.classList.remove('overlay-container');
                ft.classList.remove('overlay');
            }
        });
    }

    qelem('#form_chequera_{{ rr }}').addEventListener('submit', (evt) => {
        evt.preventDefault();
        save_chequera(evt.target);
    })
</script>
