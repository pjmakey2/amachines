<div class="tematienda_ui_container container-fluid">
    <div class="toolbar mb-3 d-flex justify-content-between align-items-center">
        <div class="toolbar-buttons">
            <button id="btn_crear_tematienda" class="btn btn-primary me-2"><i class="mdi mdi-plus"></i> Crear</button>
            <button id="btn_borrar_tematienda" class="btn btn-danger"><i class="mdi mdi-delete"></i> Borrar</button>
            <button id="btn_presets_tematienda" class="btn btn-outline-primary"><i class="mdi mdi-palette-swatch-outline"></i> Ver estilos disponibles</button>
        </div>
        <div class="toolbar-search">
            <input type="text" id="input_buscar_tematienda" class="form-control" placeholder="Buscar...">
        </div>
    </div>
    <div id="table_tematienda_ui"></div>
</div>
<script type="text/javascript">
    var gmquery_tematienda = [];
    tematienda_home_be = function (data, settings) {
        let tt = qelem(`#table_tematienda_ui`);
        tt.classList.add('overlay-container');
        tt.classList.add('overlay');
        let crdata = Object.assign({}, settings.ajax.initquery);
        let mquery = [];
        if (gmquery_tematienda.length > 0) mquery = [...mquery, ...gmquery_tematienda];
        if (mquery.length > 0) crdata.mquery = jfy(mquery);
        return Object.assign(data, crdata);
    }
    t_tematienda = `dtable_${OptsIO.s4generate()}`;
    Grid.datatables_wrapper({
          t_guid: t_tematienda,
          url_exec: '{% url "iom" %}',
          title: 'Temas de Tienda',
          tselector: 'table_tematienda_ui',
          app_name: 'Ecommerce',
          model_name: 'TemaTienda',
          cls_table: 'cell-border row-border table table-sm',
          cls_thead: 'border-gray-900',
          mquery: [],
          plength: 100,
          builder_be: tematienda_home_be,
          t_opts: {
              select: true,
              fixedHeader: true,
              responsive: null,
              scrollCollapse: true,
              scrollX: true,
              scrollY: 600,
              paging: true,
              order: [[1, 'asc']],
              rowId: function(row, se) { return `tr_tematienda_${row.id}` }
          },
          columns: [
               { fdis: true, gre: false, btyp: 'loc', idx: null, tit: 'ACC', dtyp: 'str', dfl: '', nord: false,
                dfcon: `<i title="Ver/Editar" class="tr-tematienda-query text fs-5 mdi mdi-archive-eye-outline me-1"></i><i title="Vista previa en la tienda" class="tr-tematienda-preview text fs-5 mdi mdi-eye-outline text-primary cursor-pointer"></i>` },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'nombre', tit: 'Tema', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'mdb', idx: 'get_preset_nombre', tit: 'Estilo base', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'colores_propios', tit: 'Colores propios', cls: 'align-center', dtyp: 'bool', hide: false,
                 render: (data, type, rowobj) => { return data ? 'Sí' : 'No'; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'color_acento', tit: 'Acento', cls: 'align-left', dtyp: 'str', hide: false,
                 render: (data, type, rowobj) => { return rowobj.colores_propios ? `<span style="display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid #ccc;background:${data}"></span> ${data}` : '<span class="text-muted">del estilo</span>'; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'activo', tit: 'Activo', cls: 'align-center', dtyp: 'bool', hide: false,
                 render: (data, type, rowobj) => { return data ? 'Sí' : 'No'; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'preset', tit: 'preset', cls: 'align-left', dtyp: 'str', hide: true },
          ]
      })

    tematienda_form_crud = (pk) => {
        let dattrs = { title: 'Temas de Tienda', t_guid: t_tematienda, sui_rr: '{{ rr }}', offcanvasglobal: true };
        let tps = {
            model_app_name: 'Ecommerce',
            model_name: 'TemaTienda',
            dbcon: 'default',
            url: '{% url "dtmpl" %}',
            dattrs: dattrs,
            template: 'Ecommerce/TemaTiendaCreateUi.html',
            raw: true,
        }
        if (pk) tps['pk'] = pk;
        OptsIO.getTmpl(tps).then((rsp) => {
            $('#offcanvasGlobalUiBody').html(rsp.data);
            new bootstrap.Offcanvas('#offcanvasGlobalUi').show();
            document.getElementById('offcanvasGlobalUi').addEventListener('hidden.bs.offcanvas', () => {
                $('#offcanvasGlobalUiBody').html('');
            }, { once: true })
            UiB.kILLLoaderAjax();
        })
    }


    qelem('#btn_crear_tematienda').addEventListener('click', () => tematienda_form_crud());

    $(`#${t_tematienda} tbody`).on('click', '.tr-tematienda-query', function() {
        let rowobj = $(`#${t_tematienda}`).DataTable().row($(this).closest('tr')).data();
        tematienda_form_crud(rowobj.id);
    })

    qelem('#btn_borrar_tematienda').addEventListener('click', function() {
        let ids = $(`#${t_tematienda}`).DataTable().rows({ selected: true }).data().toArray().map(row => row.id);
        if (ids.length === 0) {
            UiB.MsgError('Por favor, selecciona al menos un registro.');
            return;
        }
        UiB.MsgSwall({
            msg: `¿Borrar ${ids.length} registro(s)? Esta acción no se puede deshacer.`,
            ttype: 'info'
        }).then((result) => {
            if (!result.isConfirmed) return;
            let gbe = new FormData();
            gbe.append('module', 'Ecommerce');
            gbe.append('package', 'mng_ecommerce');
            gbe.append('attr', 'MEcommerce');
            gbe.append('mname', 'delete_catalogo');
            gbe.append('dbcon', 'default');
            gbe.append('ids', jfy(ids));
            gbe.append('model_name', 'TemaTienda');
            axios.post('{% url "iom" %}', gbe, { headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')} }).then((rsp) => {
                UiB.BeMsgHandle({ rsps: rsp.data.msgs, timer: 2000, offcanvasglobal: true });
                $(`#${t_tematienda}`).DataTable().ajax.reload();
            }).catch((err) => {
                log.error(`Error: ${jfy(err)}`);
                UiB.MsgError('Ocurrió un error. Por favor, intenta de nuevo.');
            });
        });
    });

    tematienda_post = (mname) => {
        let gbe = new FormData();
        gbe.append('module', 'Ecommerce');
        gbe.append('package', 'mng_ecommerce');
        gbe.append('attr', 'MEcommerce');
        gbe.append('mname', mname);
        gbe.append('dbcon', 'default');
        return axios.post('{% url "iom" %}', gbe, { headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')} }).then((rsp) => rsp.data);
    }
    // Galeria de estilos base: muestra colores y estructura, y abre la tienda con ?preset= para verlo aplicado
    qelem('#btn_presets_tematienda').addEventListener('click', () => {
        tematienda_post('get_presets').then((d) => {
            let esc = (v) => $('<span>').text(v == null ? '' : v).html();
            let sw = (c) => `<span style="display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #ccc;background:${c}"></span>`;
            let cards = d.presets.map((p) => `
                <div class="col-md-6"><div class="card h-100"><div class="card-body">
                    <div class="d-flex justify-content-between align-items-start"><div><h6 class="mb-0">${esc(p.nombre)}</h6><small class="text-muted">${esc(p.rubro)}</small></div>
                    ${d.tienda_url ? `<a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener" href="${d.tienda_url}?preset=${p.clave}"><i class="mdi mdi-eye-outline"></i> Ver</a>` : ''}</div>
                    <p class="small mt-2 mb-2">${esc(p.descripcion)}</p>
                    <div class="small">${sw(p.colores.primario)} ${sw(p.colores.acento)} ${sw(p.colores.fondo)} ${sw(p.colores.texto)}
                    &nbsp; <span class="badge bg-secondary">${p.sidebar ? 'con sidebar' : 'sin sidebar'}</span> <span class="badge bg-secondary">portada ${esc(p.hero)}</span></div>
                </div></div></div>`).join('');
            $('#offcanvasGlobalUiLabel').html('Estilos base de tienda');
            $('#offcanvasGlobalUiBody').html(`<p class="text-muted small">${d.tienda_url ? 'La vista previa abre tu tienda con ese estilo sin cambiar nada; solo vos lo ves mientras estés logueado.' : 'Creá una tienda activa para poder previsualizar.'}</p><div class="row g-3">${cards}</div>`);
            new bootstrap.Offcanvas('#offcanvasGlobalUi').show();
        });
    });
    $(`#${t_tematienda} tbody`).on('click', '.tr-tematienda-preview', function() {
        let rowobj = $(`#${t_tematienda}`).DataTable().row($(this).closest('tr')).data();
        tematienda_post('get_presets').then((d) => {
            if (!d.tienda_url) { UiB.MsgInfo('Creá una tienda activa para previsualizar.'); return; }
            window.open(`${d.tienda_url}?preset=${rowobj.preset}`, '_blank', 'noopener');
        });
    })

    qelem('#input_buscar_tematienda').onkeydown = (evt) => {
        if (evt.key === 'Enter') {
            gmquery_tematienda = [];
            let v = qelem('#input_buscar_tematienda').value.trim();
            if (v !== '') {
                gmquery_tematienda.push({'field': 'or_nombre__icontains', 'value': v});
            }
            $(`#${t_tematienda}`).DataTable().ajax.reload();
        }
    }

    $(`#${t_tematienda}`).on('draw.dt', function() {
        let tt = qelem(`#table_tematienda_ui`);
        tt.classList.remove('overlay-container');
        tt.classList.remove('overlay');
    })
</script>
