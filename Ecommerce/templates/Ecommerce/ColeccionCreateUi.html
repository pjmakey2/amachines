<div class="ui_coleccion">
    <form id="form_coleccion_{{ rr }}" class="form_coleccion">
        <input type="hidden" name="id" {% if mobj %} value="{{ mobj.pk }}" {% endif %}>
        <div class="row">
            <div class="col-md-6 mb-3" data-field="tiendaobj_id">
                <label>Tienda <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="tiendaobj_id" class="form-control" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-3" data-field="nombre">
                <label>Nombre <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="nombre" class="form-control" placeholder="" value='{% if mobj %}{{ mobj.nombre }}{% else %}{% endif %}' required />
                </div>
            </div>
            <div class="col-md-12 mb-3" data-field="descripcion">
                <label>Descripción</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="descripcion" class="form-control" placeholder="" value='{% if mobj %}{{ mobj.descripcion }}{% else %}{% endif %}' />
                </div>
            </div>
            <div class="col-md-6 mb-3" data-field="imagen">
                <label>Imagen</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="file" name="imagen" class="form-control" />
                </div>
                <small class="text-muted">{% if mobj and mobj.imagen %}<a href="{{ mobj.imagen.url }}" target="_blank">Ver archivo actual</a>{% endif %}</small>
            </div>
            <div class="col-md-6 mb-3" data-field="icono">
                <label>Ícono del menú lateral (Bootstrap Icons)</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="icono" class="form-control" placeholder="bi-basket" value='{% if mobj %}{{ mobj.icono }}{% else %}{% endif %}' />
                </div>
                <small class="text-muted">Nombre de un ícono de icons.getbootstrap.com</small>
            </div>
            <div class="col-md-3 mb-3" data-field="orden">
                <label>Orden</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="orden" class="form-control text-end" placeholder="" value='{% if mobj %}{{ mobj.orden|stringformat:"s" }}{% else %}0{% endif %}' />
                </div>
            </div>
            <div class="col-md-3 mb-3" data-field="activa">
                <label>Activa</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="activa" class="form-control">
                        <option value="true" {% if not mobj or mobj.activa %}selected{% endif %}>Sí</option>
                        <option value="false" {% if mobj and not mobj.activa %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-12 text-start">
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript">
    {% if not en_modal %}qelem('#offcanvasGlobalUiLabel').innerHTML = `{% if mobj %}Modificar Colección {{ mobj.pk }}{% else %}Crear Colección{% endif %}`;{% endif %}

    form_search.se_populate({
        surl: '{% url "iom" %}',
        dele: '#form_coleccion_{{ rr }} select[name=tiendaobj_id]',
        app_name: 'Ecommerce',
        model_name: 'Tienda',
        field_display: ["nombre"],
        field_id: ['id'],
        db_fields: ["id", "nombre"],
        db_methods: [],
        qs_be: [{"field": "activa", "value": true}],
        dbcon: 'default',
        headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')},
        first_selected: false,
        allowClear: false,
        width: '100%',
        dropdownParent: {% if en_modal %}$('.swal2-container'){% else %}$('#offcanvasGlobalUi'){% endif %},
        theme: 'bootstrap-5'
    }).then(() => {
        {% if mobj and mobj.tiendaobj %}
            $('#form_coleccion_{{ rr }} select[name=tiendaobj_id]').val('{{ mobj.tiendaobj.id }}').trigger('change');
        {% endif %}
    });

    initializeInputMasks_coleccion = () => {
        let maskDecimal = {
            alias: 'numeric', groupSeparator: ',', radixPoint: '.', autoGroup: true, digits: 2,
            digitsOptional: false, rightAlign: true, allowMinus: false,
            removeMaskOnSubmit: true, autoUnmask: true
        };
        let maskEntero = Object.assign({}, maskDecimal, { digits: 0, groupSeparator: '', autoGroup: false });
        Inputmask(maskEntero).mask(qelem('#form_coleccion_{{ rr }} input[name=orden]'));
    }
    initializeInputMasks_coleccion();

    save_coleccion = (target) => {
        let fdata = new FormData();
        fdata.append('module', 'OptsIO');
        fdata.append('package', 'io_maction');
        fdata.append('attr', 'IOMaction');
        fdata.append('mname', 'process_record');
        fdata.append('model_app_name', 'Ecommerce');
        fdata.append('model_name', 'Coleccion');
        fdata.append('dbcon', 'default');
        let edata = form_serials.form_to_json(new FormData(target));
        ["tiendaobj_id"].forEach((idx) => {
            let vv = $(`#form_coleccion_{{ rr }} select[name=${idx}]`).val();
            if (vv !== undefined) edata[idx] = vv;
        });
        // Leer valores sin mascara directamente del inputmask (el backend recibe punto decimal)
        ["orden"].forEach((f) => {
            let el = qelem(`#form_coleccion_{{ rr }} input[name=${f}]`);
            if (el && el.inputmask) edata[f] = el.inputmask.unmaskedvalue().replace(',', '.');
        });
        ["imagen"].forEach((f) => {
            let el = qelem(`#form_coleccion_{{ rr }} input[name=${f}]`);
            delete edata[f];
            if (el && el.files.length > 0) fdata.append(f, el.files[0]);
        });
        
        fdata.append('uc_fields', jfy(edata));
        fdata.append('b_vals', jfy([]));
        fdata.append('c_a', jfy([{ 'module': 'Ecommerce', 'package': 'mng_ecommerce', 'attr': 'MEcommerce', 'mname': 'save_coleccion', 'cont': false, 'show_success': true }]));
        fdata.append('a_vals', jfy([]));
        let fele = document.querySelector('#form_coleccion_{{ rr }}');
        fele.classList.add('overlay-container');
        fele.classList.add('overlay');
        return axios.post('{% url "iom" %}', fdata, { headers: { 'X-CSRFToken': OptsIO.getCookie('csrftoken') } })
        .then((rsp) => {
            let msgs = rsp.data.hasOwnProperty('msgs') ? rsp.data.msgs : [rsp.data];
            let got_error = msgs.some((ee) => ee.error);
            UiB.BeMsgHandle({ rsps: msgs, timer: 2000, offcanvasglobal: {% if en_modal %}false{% else %}true{% endif %} });
            if (!got_error) {
                $('#{{ t_guid }}').DataTable().ajax.reload();
                
            }
        }).catch((err) => {
            log.error(`#form_coleccion Error in save record: ` + JSON.stringify(err, null, 2));
            UiB.MsgError(err);
        }).finally(() => {
            let ft = document.querySelector('#form_coleccion_{{ rr }}');
            if (ft) {
                ft.classList.remove('overlay-container');
                ft.classList.remove('overlay');
            }
        });
    }

    qelem('#form_coleccion_{{ rr }}').addEventListener('submit', (evt) => {
        evt.preventDefault();
        save_coleccion(evt.target);
    })
</script>
