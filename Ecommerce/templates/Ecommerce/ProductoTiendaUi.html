<div class="productotienda_ui_container container-fluid">
    <div class="toolbar mb-3 d-flex justify-content-between align-items-center">
        <div class="toolbar-buttons">
            <button id="btn_crear_productotienda" class="btn btn-primary me-2"><i class="mdi mdi-plus"></i> Publicar producto</button>
            <button id="btn_borrar_productotienda" class="btn btn-danger"><i class="mdi mdi-delete"></i> Borrar</button>
        </div>
        <div class="toolbar-search">
            <input type="text" id="input_buscar_productotienda" class="form-control" placeholder="Buscar...">
        </div>
    </div>
    <div id="table_productotienda_ui"></div>
</div>
<script type="text/javascript">
    var gmquery_productotienda = [];
    productotienda_home_be = function (data, settings) {
        let tt = qelem(`#table_productotienda_ui`);
        tt.classList.add('overlay-container');
        tt.classList.add('overlay');
        let crdata = Object.assign({}, settings.ajax.initquery);
        let mquery = [];
        if (gmquery_productotienda.length > 0) mquery = [...mquery, ...gmquery_productotienda];
        if (mquery.length > 0) crdata.mquery = jfy(mquery);
        return Object.assign(data, crdata);
    }
    t_productotienda = `dtable_${OptsIO.s4generate()}`;
    Grid.datatables_wrapper({
          t_guid: t_productotienda,
          url_exec: '{% url "iom" %}',
          title: 'Productos Publicados',
          tselector: 'table_productotienda_ui',
          app_name: 'Ecommerce',
          model_name: 'ProductoTienda',
          cls_table: 'cell-border row-border table table-sm',
          cls_thead: 'border-gray-900',
          mquery: [],
          plength: 100,
          builder_be: productotienda_home_be,
          t_opts: {
              select: true,
              fixedHeader: true,
              responsive: null,
              scrollCollapse: true,
              scrollX: true,
              scrollY: 600,
              paging: true,
              order: [[1, 'asc']],
              rowId: function(row, se) { return `tr_productotienda_${row.id}` }
          },
          columns: [
               { fdis: true, gre: false, btyp: 'loc', idx: null, tit: 'ACC', dtyp: 'str', dfl: '', nord: false,
                dfcon: `<i title="Ver/Editar" class="tr-productotienda-query text fs-5 mdi mdi-archive-eye-outline"></i>` },
              { fdis: true, gre: true, btyp: 'mdb', idx: 'get_imagen', tit: 'Foto', cls: 'align-left', dtyp: 'str', hide: false,
                 render: (data, type, rowobj) => { return data ? `<img src="${data}" style="width:44px;height:44px;object-fit:cover;border-radius:4px;">` : ''; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'tiendaobj__nombre', tit: 'Tienda', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'titulo', tit: 'Título', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'coleccionobj__nombre', tit: 'Colección', cls: 'align-left', dtyp: 'str', hide: false },
              { fdis: true, gre: true, btyp: 'mdb', idx: 'get_precio', tit: 'Precio', cls: 'align-right', dtyp: 'float', hide: false,
                 render: (data, type, rowobj) => { return UiN.formatNumberU(parseFloat(data || 0).toFixed(0)); } },
              { fdis: true, gre: true, btyp: 'mdb', idx: 'get_disponible', tit: 'Disponible', cls: 'align-right', dtyp: 'float', hide: false,
                 render: (data, type, rowobj) => { return UiN.formatNumberU(parseFloat(data || 0).toFixed(0)); } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'destacado', tit: 'Destacado', cls: 'align-center', dtyp: 'bool', hide: false,
                 render: (data, type, rowobj) => { return data ? 'Sí' : 'No'; } },
              { fdis: true, gre: true, btyp: 'fdb', idx: 'publicado', tit: 'Publicado', cls: 'align-center', dtyp: 'bool', hide: false,
                 render: (data, type, rowobj) => { return data ? 'Sí' : 'No'; } },
          ]
      })

    productotienda_form_crud = (pk) => {
        let dattrs = { title: 'Productos Publicados', t_guid: t_productotienda, sui_rr: '{{ rr }}', offcanvasglobal: true };
        let tps = {
            model_app_name: 'Ecommerce',
            model_name: 'ProductoTienda',
            dbcon: 'default',
            url: '{% url "dtmpl" %}',
            dattrs: dattrs,
            template: 'Ecommerce/ProductoTiendaCreateUi.html',
            raw: true,
        }
        if (pk) tps['pk'] = pk;
        OptsIO.getTmpl(tps).then((rsp) => {
            $('#offcanvasGlobalUiBody').html(rsp.data);
            new bootstrap.Offcanvas('#offcanvasGlobalUi').show();
            document.getElementById('offcanvasGlobalUi').addEventListener('hidden.bs.offcanvas', () => {
                $('#offcanvasGlobalUiBody').html('');
            }, { once: true })
            UiB.kILLLoaderAjax();
        })
    }


    qelem('#btn_crear_productotienda').addEventListener('click', () => productotienda_form_crud());

    $(`#${t_productotienda} tbody`).on('click', '.tr-productotienda-query', function() {
        let rowobj = $(`#${t_productotienda}`).DataTable().row($(this).closest('tr')).data();
        productotienda_form_crud(rowobj.id);
    })

    qelem('#btn_borrar_productotienda').addEventListener('click', function() {
        let ids = $(`#${t_productotienda}`).DataTable().rows({ selected: true }).data().toArray().map(row => row.id);
        if (ids.length === 0) {
            UiB.MsgError('Por favor, selecciona al menos un registro.');
            return;
        }
        UiB.MsgSwall({
            msg: `¿Borrar ${ids.length} registro(s)? Esta acción no se puede deshacer.`,
            ttype: 'info'
        }).then((result) => {
            if (!result.isConfirmed) return;
            let gbe = new FormData();
            gbe.append('module', 'Ecommerce');
            gbe.append('package', 'mng_ecommerce');
            gbe.append('attr', 'MEcommerce');
            gbe.append('mname', 'delete_catalogo');
            gbe.append('dbcon', 'default');
            gbe.append('ids', jfy(ids));
            gbe.append('model_name', 'ProductoTienda');
            axios.post('{% url "iom" %}', gbe, { headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')} }).then((rsp) => {
                UiB.BeMsgHandle({ rsps: rsp.data.msgs, timer: 2000, offcanvasglobal: true });
                $(`#${t_productotienda}`).DataTable().ajax.reload();
            }).catch((err) => {
                log.error(`Error: ${jfy(err)}`);
                UiB.MsgError('Ocurrió un error. Por favor, intenta de nuevo.');
            });
        });
    });

    qelem('#input_buscar_productotienda').onkeydown = (evt) => {
        if (evt.key === 'Enter') {
            gmquery_productotienda = [];
            let v = qelem('#input_buscar_productotienda').value.trim();
            if (v !== '') {
                gmquery_productotienda.push({'field': 'or_titulo__icontains', 'value': v});
                gmquery_productotienda.push({'field': 'or_productoobj__descripcion__icontains', 'value': v});
            }
            $(`#${t_productotienda}`).DataTable().ajax.reload();
        }
    }

    $(`#${t_productotienda}`).on('draw.dt', function() {
        let tt = qelem(`#table_productotienda_ui`);
        tt.classList.remove('overlay-container');
        tt.classList.remove('overlay');
    })
</script>
