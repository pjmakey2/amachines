<div class="ui_ubicacion">
    <form id="form_ubicacion_{{ rr }}" class="form_ubicacion">
        <input type="hidden" name="id" {% if mobj %} value="{{ mobj.pk }}" {% endif %}>
        <div class="row">
            <div class="col-md-6 mb-3" data-field="bodegaobj_id">
                <label>Bodega <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="bodegaobj_id" class="form-control" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-3" data-field="codigo">
                <label>Código <span class="text-danger">*</span></label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="codigo" class="form-control" placeholder="A-01-03" value='{% if mobj %}{{ mobj.codigo }}{% else %}{% endif %}' required />
                </div>
                <small class="text-muted">Pasillo-estante-nivel, o el nombre del muelle.</small>
            </div>
            <div class="col-md-6 mb-3" data-field="tipo">
                <label>Tipo</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="tipo" class="form-control">
                        <option value="recepcion" {% if mobj and mobj.tipo == "recepcion" %}selected{% endif %}>Recepción (muelle)</option>
                        <option value="almacenaje" {% if mobj and mobj.tipo == "almacenaje" %}selected{% endif %}>Almacenaje</option>
                        <option value="picking" {% if mobj and mobj.tipo == "picking" %}selected{% endif %}>Picking</option>
                        <option value="averiados" {% if mobj and mobj.tipo == "averiados" %}selected{% endif %}>Averiados / no vendible</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-3" data-field="activo">
                <label>Activa</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <select name="activo" class="form-control">
                        <option value="true" {% if not mobj or mobj.activo %}selected{% endif %}>Sí</option>
                        <option value="false" {% if mobj and not mobj.activo %}selected{% endif %}>No</option>
                    </select>
                </div>
            </div>
            <div class="col-md-12 mb-3" data-field="descripcion">
                <label>Descripción</label>
                <div class="input-group flex-nowrap am_focus_highlight">
                    <input type="text" name="descripcion" class="form-control" placeholder="" value='{% if mobj %}{{ mobj.descripcion }}{% else %}{% endif %}' />
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-12 text-start">
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript">
    {% if not en_modal %}qelem('#offcanvasGlobalUiLabel').innerHTML = `{% if mobj %}Modificar Ubicación {{ mobj.pk }}{% else %}Crear Ubicación{% endif %}`;{% endif %}

    form_search.se_populate({
        surl: '{% url "iom" %}',
        dele: '#form_ubicacion_{{ rr }} select[name=bodegaobj_id]',
        app_name: 'Almacen',
        model_name: 'Bodega',
        field_display: ["nombre"],
        field_id: ['id'],
        db_fields: ["id", "nombre"],
        db_methods: [],
        qs_be: [{"field": "activo", "value": true}],
        dbcon: 'default',
        headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')},
        first_selected: false,
        allowClear: false,
        width: '100%',
        dropdownParent: {% if en_modal %}$('.swal2-container'){% else %}$('#offcanvasGlobalUi'){% endif %},
        theme: 'bootstrap-5'
    }).then(() => {
        {% if mobj and mobj.bodegaobj %}
            $('#form_ubicacion_{{ rr }} select[name=bodegaobj_id]').val('{{ mobj.bodegaobj.id }}').trigger('change');
        {% endif %}
    });

    save_ubicacion = (target) => {
        let fdata = new FormData();
        fdata.append('module', 'OptsIO');
        fdata.append('package', 'io_maction');
        fdata.append('attr', 'IOMaction');
        fdata.append('mname', 'process_record');
        fdata.append('model_app_name', 'Almacen');
        fdata.append('model_name', 'Ubicacion');
        fdata.append('dbcon', 'default');
        let edata = form_serials.form_to_json(new FormData(target));
        ["bodegaobj_id"].forEach((idx) => {
            let vv = $(`#form_ubicacion_{{ rr }} select[name=${idx}]`).val();
            if (vv !== undefined) edata[idx] = vv;
        });
        // Leer valores sin mascara directamente del inputmask (el backend recibe punto decimal)
        [].forEach((f) => {
            let el = qelem(`#form_ubicacion_{{ rr }} input[name=${f}]`);
            if (el && el.inputmask) edata[f] = el.inputmask.unmaskedvalue().replace(',', '.');
        });
        [].forEach((f) => {
            let el = qelem(`#form_ubicacion_{{ rr }} input[name=${f}]`);
            delete edata[f];
            if (el && el.files.length > 0) fdata.append(f, el.files[0]);
        });
        
        fdata.append('uc_fields', jfy(edata));
        fdata.append('b_vals', jfy([]));
        fdata.append('c_a', jfy([]));
        fdata.append('a_vals', jfy([]));
        let fele = document.querySelector('#form_ubicacion_{{ rr }}');
        fele.classList.add('overlay-container');
        fele.classList.add('overlay');
        return axios.post('{% url "iom" %}', fdata, { headers: { 'X-CSRFToken': OptsIO.getCookie('csrftoken') } })
        .then((rsp) => {
            let msgs = rsp.data.hasOwnProperty('msgs') ? rsp.data.msgs : [rsp.data];
            let got_error = msgs.some((ee) => ee.error);
            UiB.BeMsgHandle({ rsps: msgs, timer: 2000, offcanvasglobal: {% if en_modal %}false{% else %}true{% endif %} });
            if (!got_error) {
                $('#{{ t_guid }}').DataTable().ajax.reload();
                
            }
        }).catch((err) => {
            log.error(`#form_ubicacion Error in save record: ` + JSON.stringify(err, null, 2));
            UiB.MsgError(err);
        }).finally(() => {
            let ft = document.querySelector('#form_ubicacion_{{ rr }}');
            if (ft) {
                ft.classList.remove('overlay-container');
                ft.classList.remove('overlay');
            }
        });
    }

    qelem('#form_ubicacion_{{ rr }}').addEventListener('submit', (evt) => {
        evt.preventDefault();
        save_ubicacion(evt.target);
    })
</script>
