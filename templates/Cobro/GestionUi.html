<div class="scroll pe-5 mt-2"
    data-kt-scroll="true"
    data-kt-scroll-height="auto"
    data-kt-scroll-wrappers="#CobroHome_{{ rr }}"
    data-kt-scroll-offset="100px">
    <div id="CobroHome_{{ rr }}">
        <ul class="nav nav-tabs mb-3" id="cobroTabs_{{ rr }}" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-facturas-btn_{{ rr }}"
                        data-bs-toggle="tab" data-bs-target="#tab-facturas_{{ rr }}"
                        type="button" role="tab" data-tmpl="Cobro/GestionFacturaUi.html">
                    <i class="mdi mdi-receipt-text"></i> Facturas
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-recibos-btn_{{ rr }}"
                        data-bs-toggle="tab" data-bs-target="#tab-recibos_{{ rr }}"
                        type="button" role="tab" data-tmpl="Cobro/ReciboUi.html">
                    <i class="mdi mdi-file-document-outline"></i> Recibos
                </button>
            </li>
        </ul>

        <div class="tab-content" id="cobroTabsContent_{{ rr }}">
            <div class="tab-pane fade show active" id="tab-facturas_{{ rr }}" role="tabpanel"></div>
            <div class="tab-pane fade" id="tab-recibos_{{ rr }}" role="tabpanel"></div>
        </div>
    </div>
</div>

<script type="text/javascript">
(function() {
    var loadedTabs_{{ rr }} = {};

    function loadCobroTab(paneId, tmpl) {
        if (loadedTabs_{{ rr }}[paneId]) return;
        loadedTabs_{{ rr }}[paneId] = true;

        OptsIO.getTmpl({
            url: '{% url "dtmpl" %}',
            template: tmpl,
            model_app_name: 'Cobro',
            model_name: 'Cobro',
            dbcon: 'default',
            dattrs: {},
            raw: true,
        }).then((rsp) => {
            $('#' + paneId).html(rsp.data);
            UiB.kILLLoaderAjax();
        }).catch(() => {
            loadedTabs_{{ rr }}[paneId] = false;
        });
    }

    // Cargar tab activa por defecto
    $(document).ready(function() {
        loadCobroTab('tab-facturas_{{ rr }}', 'Cobro/GestionFacturaUi.html');
    });

    // Cargar tab on-demand la primera vez que se muestra
    $('#cobroTabs_{{ rr }} button[data-bs-toggle="tab"]').on('shown.bs.tab', function(e) {
        var target = $(e.target).data('bs-target').replace('#', '');
        var tmpl = $(e.target).data('tmpl');
        loadCobroTab(target, tmpl);
    });
})();
</script>
