<style>
    #tabla_cobro_multiple tbody td { vertical-align: middle; }
    .cobro-multi-total-diff-ok { color: #198754; font-weight: bold; }
    .cobro-multi-total-diff-err { color: #dc3545; font-weight: bold; }
</style>

<div class="container-fluid p-3">
    <h5 class="mb-3">Cargar Pagos Multiples</h5>

    <!-- Info del cliente -->
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="form-floating form-floating-sm">
                <input type="text" id="cm_cliente_nombre" class="form-control" readonly>
                <label>Cliente</label>
            </div>
        </div>
        <div class="col-md-3">
            <div class="form-floating form-floating-sm">
                <input type="text" id="cm_cliente_ruc" class="form-control" readonly>
                <label>RUC</label>
            </div>
        </div>
        <div class="col-md-3">
            <div class="form-floating form-floating-sm">
                <input type="date" id="cm_fecha_pago" class="form-control">
                <label>Fecha de Pago *</label>
            </div>
        </div>
    </div>

    <!-- Tabla de facturas -->
    <h6>Facturas seleccionadas</h6>
    <div class="table-responsive mb-3">
        <table class="table table-sm table-striped" id="tabla_cobro_multiple">
            <thead>
                <tr>
                    <th>Numero</th>
                    <th>Fecha</th>
                    <th>Plazo</th>
                    <th class="text-center">Dias Venc.</th>
                    <th class="text-end">Total Factura</th>
                    <th class="text-end">Saldo</th>
                </tr>
            </thead>
            <tbody id="cm_facturas_body">
                <tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr>
            </tbody>
            <tfoot>
                <tr class="fw-bold">
                    <th colspan="5" class="text-end">TOTAL SALDO A COBRAR</th>
                    <th class="text-end" id="cm_total_saldo">Gs 0</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <hr>

    <!-- Forma de pago -->
    <h6>Forma de pago</h6>
    <div class="row g-2 mb-2 align-items-end">
        <div class="col-md-3">
            <label class="form-label small mb-1">Metodo *</label>
            <select id="cm_metodo_pago" class="form-select form-select-sm">
                <option value="">Seleccionar...</option>
                <option value="efectivo">Efectivo</option>
                <option value="transferencia">Transferencia Bancaria</option>
                <option value="cheque">Cheque</option>
                <option value="tarjeta">Tarjeta Credito/Debito</option>
                <option value="retencion">Retencion</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small mb-1">Monto (Gs) *</label>
            <input type="number" step="1" min="0" id="cm_monto" class="form-control form-control-sm text-end" value="0" disabled>
        </div>
        <div class="col-md-6">
            <label class="form-label small mb-1">Referencia</label>
            <input type="text" id="cm_referencia" class="form-control form-control-sm" placeholder="Seleccione un metodo primero" disabled>
        </div>
    </div>
    <div class="mb-3 small text-end">
        <span>Diferencia vs saldo: </span>
        <span id="cm_diferencia" class="cobro-multi-total-diff-err">Gs 0</span>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <button type="button" class="btn btn-success btn-lg" id="btn-confirmar-cobro-multi" disabled>
            <i class="mdi mdi-content-save"></i> Registrar Pagos y Generar Recibo
        </button>
    </div>
</div>

<script type="text/javascript">
(function() {
    // Fecha por defecto
    document.getElementById('cm_fecha_pago').valueAsDate = new Date();

    let facturaIds = window.cobroMultipleData || [];
    if (!facturaIds.length) {
        $('#cm_facturas_body').html('<tr><td colspan="6" class="text-center text-danger">No hay facturas seleccionadas</td></tr>');
        return;
    }

    var totalSaldo = 0;

    // Cargar facturas
    let gbe = new FormData();
    gbe.append('module', 'Cobro');
    gbe.append('package', 'mng_cobro');
    gbe.append('attr', 'MCobro');
    gbe.append('mname', 'get_facturas_para_cobro_multiple');
    gbe.append('dbcon', 'default');
    facturaIds.forEach(id => gbe.append('facturas[]', id));

    axios.post('{% url "iom" %}', gbe, {
        headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')}
    }).then((rsp) => {
        if (rsp.data.error) {
            $('#cm_facturas_body').html(`<tr><td colspan="6" class="text-center text-danger">${rsp.data.error}</td></tr>`);
            return;
        }
        if (!rsp.data.success) return;

        let d = rsp.data;
        $('#cm_cliente_nombre').val(d.cliente.pdv_nombrefactura);
        $('#cm_cliente_ruc').val(d.cliente.pdv_ruc);

        let tbody = $('#cm_facturas_body');
        tbody.empty();
        d.facturas.forEach((f) => {
            let diasBadge = f.dias_vencido > 0
                ? `<span class="badge bg-danger">${f.dias_vencido}</span>`
                : '<span class="badge bg-success">Al dia</span>';
            tbody.append(`
                <tr>
                    <td>${f.doc_numero}</td>
                    <td>${moment(f.doc_fecha).format('DD/MM/YY')}</td>
                    <td>${f.doc_cre_plazo || '-'}</td>
                    <td class="text-center">${diasBadge}</td>
                    <td class="text-end">Gs ${UiN.formatNumberU(f.total_factura.toFixed(0))}</td>
                    <td class="text-end fw-bold text-danger">Gs ${UiN.formatNumberU(f.doc_saldo.toFixed(0))}</td>
                </tr>
            `);
        });

        totalSaldo = d.total_saldo;
        $('#cm_total_saldo').text('Gs ' + UiN.formatNumberU(totalSaldo.toFixed(0)));
        actualizarTotales();
    });

    // Placeholders de referencia por metodo
    const cm_ref_placeholders = {
        efectivo:      'Opcional',
        transferencia: 'Nro. de transferencia',
        cheque:        'Nro. de cheque',
        tarjeta:       'Nro. de autorizacion / cupon',
        retencion:     'Nro. de comprobante de retencion'
    };

    function actualizarTotales() {
        let metodo = $('#cm_metodo_pago').val();
        let monto = parseFloat($('#cm_monto').val()) || 0;
        if (monto < 0) monto = 0;

        let diff = monto - totalSaldo;
        let $diff = $('#cm_diferencia');
        $diff.text('Gs ' + UiN.formatNumberU(diff.toFixed(0)));

        // Habilitar boton solo si: hay metodo, hay monto y coincide con el saldo total
        let ok = (!!metodo) && (totalSaldo > 0) && (monto > 0) && (Math.abs(diff) < 0.5);
        if (ok) {
            $diff.removeClass('cobro-multi-total-diff-err').addClass('cobro-multi-total-diff-ok');
            $('#btn-confirmar-cobro-multi').prop('disabled', false);
        } else {
            $diff.removeClass('cobro-multi-total-diff-ok').addClass('cobro-multi-total-diff-err');
            $('#btn-confirmar-cobro-multi').prop('disabled', true);
        }
    }

    // Al elegir metodo: habilitar monto+referencia, prefill del monto con saldo total,
    // placeholder segun metodo. Bindeo directo (no delegado) para que al recargar el
    // template los listeners viejos se destruyan junto con el elemento anterior y
    // no queden pisando el `totalSaldo` de la carga previa.
    $('#cm_metodo_pago').off('change').on('change', function() {
        let metodo = $(this).val();
        let hay = !!metodo;
        $('#cm_monto').prop('disabled', !hay);
        $('#cm_referencia').prop('disabled', !hay);
        $('#cm_referencia').attr('placeholder', hay ? (cm_ref_placeholders[metodo] || '') : 'Seleccione un metodo primero');
        if (hay) {
            let m = parseFloat($('#cm_monto').val()) || 0;
            if (m <= 0 && totalSaldo > 0) $('#cm_monto').val(Math.round(totalSaldo));
        } else {
            $('#cm_monto').val(0);
            $('#cm_referencia').val('');
        }
        actualizarTotales();
    });

    $('#cm_monto').off('input change').on('input change', actualizarTotales);

    // Confirmar
    $('#btn-confirmar-cobro-multi').off('click').on('click', function() {
        Swal.fire({
            title: 'Registrar pagos y generar recibo?',
            text: 'Se cargaran los pagos por metodo y se emitira un unico recibo por las facturas seleccionadas',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Si, confirmar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (!result.isConfirmed) return;

            let gbe2 = new FormData();
            gbe2.append('module', 'Cobro');
            gbe2.append('package', 'mng_cobro');
            gbe2.append('attr', 'MCobro');
            gbe2.append('mname', 'registrar_pagos_multiple_y_recibo');
            gbe2.append('dbcon', 'default');

            facturaIds.forEach(id => gbe2.append('facturas[]', id));
            gbe2.append('fecha_pago', $('#cm_fecha_pago').val());

            // Un solo metodo: enviamos el elegido con su monto/ref, resto en 0/''
            let metodo_sel = $('#cm_metodo_pago').val();
            let monto_sel = parseFloat($('#cm_monto').val()) || 0;
            let ref_sel = $('#cm_referencia').val() || '';
            ['efectivo','transferencia','cheque','tarjeta','retencion'].forEach(m => {
                gbe2.append('monto_' + m, m === metodo_sel ? monto_sel : 0);
                gbe2.append('ref_' + m,   m === metodo_sel ? ref_sel   : '');
            });

            $('#btn-confirmar-cobro-multi').prop('disabled', true);

            Swal.fire({
                title: 'Generando recibo...',
                text: 'Registrando pagos y creando el recibo, por favor espere',
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => { Swal.showLoading(); }
            });

            axios.post('{% url "iom" %}', gbe2, {
                headers: {'X-CSRFToken': OptsIO.getCookie('csrftoken')}
            }).then((rsp) => {
                if (rsp.data.success) {
                    if (rsp.data.pdf_url) {
                        let link = document.createElement('a');
                        link.href = rsp.data.pdf_url;
                        link.target = '_blank';
                        link.click();
                    }
                    Swal.close();
                    UiB.MsgSuccess(rsp.data.message);

                    let offcanvasEl = document.getElementById('offcanvasGlobalUi');
                    let bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
                    if (bsOffcanvas) bsOffcanvas.hide();

                    if (typeof window.cobroTableGuid !== 'undefined') {
                        $(`#${window.cobroTableGuid}`).DataTable().ajax.reload();
                    }
                    if (typeof window.cargarResumenCobros === 'function') {
                        window.cargarResumenCobros();
                    }
                    if (typeof window.limpiarSeleccionRecibo === 'function') {
                        window.limpiarSeleccionRecibo();
                    }
                } else if (rsp.data.error) {
                    Swal.close();
                    UiB.MsgError(rsp.data.error);
                    $('#btn-confirmar-cobro-multi').prop('disabled', false);
                }
            }).catch(() => {
                Swal.close();
                $('#btn-confirmar-cobro-multi').prop('disabled', false);
            }).finally(() => { Swal.hideLoading(); });
        });
    });
})();
</script>
